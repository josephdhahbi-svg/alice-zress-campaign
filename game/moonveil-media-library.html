<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonveil Visual Media Library</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:auto;max-width:1200px;padding:14px;background:#090f18;color:#f6f0df;font:16px system-ui}h1{color:#f3c97b}button,input,select{font:inherit;padding:10px;border-radius:8px;color:white;background:#20343e;border:1px solid #6f8a83}.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px;margin-top:18px}.tile{min-width:0;overflow:hidden;border:1px solid #576a69;border-radius:12px;background:#18222b}.tile img,.tile video{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}.tile audio{width:100%}.tile label{display:block;font-size:12px;padding:7px;word-wrap:break-word}.tile button{width:100%}#viewer{position:fixed;inset:0;background:#05090df5;padding:12px;z-index:9;overflow:auto}#viewer img,#viewer video{display:block;max-width:100%;max-height:79vh;margin:auto;object-fit:contain}#viewer[hidden]{display:none}a{color:#f1cf93}small{color:#bfc8c4}</style></head><body><a href="./moonveil-hub.html">← Game Hub</a><h1>Moonveil Visual Media Library</h1><p>Import your original artwork, video and audio files into this browser's private media collection. Images remain on your device unless you separately publish them. The game's historical artwork has not been imported automatically.</p><div class="controls"><label>Choose media <input type="file" id="files" multiple accept="image/*,video/*,audio/*"></label><label>Choose folder <input type="file" id="folder" multiple webkitdirectory></label><select id="kind"><option value="">All media</option><option value="image/">Images</option><option value="video/">Videos</option><option value="audio/">Audio</option></select><button id="refresh">Refresh</button></div><p id="status" role="status"></p><section id="gallery" class="gallery"></section><section id="viewer" hidden aria-label="Media preview"><button id="close">Close preview</button><div id="large"></div></section><script>
"use strict";const $=id=>document.getElementById(id),DB="moonveil-visual-media-v1";let db,urls=[];function release(){urls.forEach(u=>URL.revokeObjectURL(u));urls=[]}const request=indexedDB.open(DB,1);request.onupgradeneeded=()=>{const store=request.result.createObjectStore("media",{keyPath:"id"});store.createIndex("type","type")};request.onsuccess=()=>{db=request.result;render()};request.onerror=()=>{$("status").textContent="Browser media storage unavailable."};function tx(mode){return db.transaction("media",mode).objectStore("media")}function add(files){if(!db)return;const acceptable=[...files].filter(f=>/^(image|video|audio)\//.test(f.type));const store=tx("readwrite");for(const f of acceptable){const name=f.webkitRelativePath||f.name;const id=name+"::"+f.size+"::"+f.lastModified;store.put({id,name,type:f.type,blob:f,lastModified:f.lastModified})}store.transaction.oncomplete=()=>{$("status").textContent="Imported "+acceptable.length+" media files into this browser.";render()};store.transaction.onerror=()=>{$("status").textContent="Import incomplete. Browser storage may be full."}}$("files").onchange=e=>{add(e.target.files);e.target.value=""};$("folder").onchange=e=>{add(e.target.files);e.target.value=""};$("refresh").onclick=render;$("kind").onchange=render;$("close").onclick=()=>{$("viewer").hidden=true;$("large").replaceChildren()};function render(){if(!db)return;release();const req=tx("readonly").getAll();req.onsuccess=()=>{const items=req.result.filter(m=>m.type.startsWith($("kind").value));$("gallery").replaceChildren();$("status").textContent=items.length+" media assets shown; local browser only.";for(const m of items){const tile=document.createElement("article");tile.className="tile";const url=URL.createObjectURL(m.blob);urls.push(url);let el;if(m.type.startsWith("image/")){el=document.createElement("img");el.loading="lazy";el.src=url;el.alt=m.name}else if(m.type.startsWith("video/")){el=document.createElement("video");el.src=url;el.muted=true;el.preload="metadata"}else{el=document.createElement("audio");el.src=url;el.controls=true}tile.append(el);const cap=document.createElement("label");cap.textContent=m.name;tile.append(cap);const open=document.createElement("button");open.textContent="View";open.onclick=()=>{const large=$("large");large.replaceChildren();const media=el.cloneNode();media.controls=true;media.autoplay=false;large.append(media);$("viewer").hidden=false};tile.append(open);$("gallery").append(tile)}}}</script></body></html>
