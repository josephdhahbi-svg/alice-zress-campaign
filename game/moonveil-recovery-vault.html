<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonveil Recovery Vault</title><style>:root{color-scheme:dark}body{font:16px system-ui;background:#0c161c;color:#eaf2ed;max-width:820px;margin:auto;padding:16px}h1,h2{color:#f1d08d}article{background:#192931;border:1px solid #526c68;border-radius:10px;padding:12px;margin:10px 0}small{color:#a8bbb6}</style><a href="./moonveil-hub.html">← Game Hub</a><h1>Moonveil Recovery Vault</h1><p>Original files discovered in your ChatGPT Library. These are source references, not downloadable copies or installed images. Never replace verified saves with an archive.</p><div id="results">Loading registry…</div><script>fetch("./data/recovered-assets-index.json").then(r=>{if(!r.ok)throw Error("index unavailable");return r.json()}).then(data=>{const root=document.getElementById("results");root.replaceChildren();for(const [field,title] of [["characterSources","Character and Data Sources"],["artSources","Visual Asset Sources"],["knownCheckpoints","Character Checkpoints"]]){const h=document.createElement("h2");h.textContent=title;root.append(h);for(const item of data[field]||[]){const card=document.createElement("article");const name=document.createElement("strong");name.textContent=item.title||item.name||item.id;const detail=document.createElement("p");detail.textContent=item.source||item.location||"";const status=document.createElement("small");status.textContent=item.status||"Located source reference; binary not imported";card.append(name,detail,status);root.append(card)}}}).catch(()=>document.getElementById("results").textContent="Recovery registry unavailable. Check deployment assets.");</script></html>
