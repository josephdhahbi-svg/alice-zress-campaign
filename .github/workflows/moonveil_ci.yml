name: Moonveil CI Validation

on:
  push:
    branches:
      - main
      - dev/alice-three-chosen-roadmap
  pull_request:
    branches:
      - main
      - dev/alice-three-chosen-roadmap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show runtime
        run: python --version

      - name: Validate JSON registries and entity records
        run: python scripts/validate.py

      - name: Validate Netheril route graph
        run: python scripts/validate_netheril_routes.py

      - name: Run route-planner demonstration checks
        run: python scripts/route_planner.py --demo

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
