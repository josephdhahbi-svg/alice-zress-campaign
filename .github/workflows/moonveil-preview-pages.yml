name: Deploy Moonveil Preview
on:
  push:
    branches: [feature/alice-playable-encounter-20261018]
    paths:
      - 'game/**'
      - '.github/workflows/moonveil-preview-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: moonveil-preview-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage static game
        run: |
          mkdir -p _site
          cp game/moonveil-hub.html _site/index.html
          cp game/alice-elder-eye-playtest.html _site/
          cp game/vesper-archive.html _site/
          cp game/moonveil-dialogue.js _site/
          cp game/moonveil-characters.html _site/
          cp game/index.html _site/original-alice.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
