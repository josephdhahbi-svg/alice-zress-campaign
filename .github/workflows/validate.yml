name: Validate campaign records
on:
  push:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'game/**'
      - 'backend/**'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'game/**'
      - 'backend/**'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON record metadata
        run: python scripts/validate.py
      - name: Check deterministic encounter simulation
        run: python scripts/simulate.py --test
      - name: Check Book 1 scene and browser prototype
        run: python scripts/test_book1.py
      - name: Check Living World Engine
        run: python scripts/test_living_world.py
      - name: Test SQLite campaign event ledger
        run: python -m unittest discover -s backend -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server syntax
        run: node --check server.js
      - name: Install Node backend dependencies
        run: npm install --no-audit --no-fund
      - name: Test authenticated SQLite server
        run: node --test backend/server.integration.test.js
      - name: Test campaign WebSocket isolation
        run: node --test backend/campaign-websocket.test.js
      - name: Test SQLite online backup service
        run: node --test backend/backup-service.test.js
      - name: Test WAL backup restore integration
        run: node --test backend/backup-restore.integration.test.js
      - name: Check Faction Territory Pulse Engine
        run: node --test backend/faction-pulse.test.js
      - name: Test transactional faction disputes
        run: node --test backend/faction-dispute-engine.test.js
      - name: Test authenticated browser roll client
        run: node --test backend/roll-client.test.js
      - name: Test deterministic d20 resolution
        run: node --test backend/dice-rules.test.js
      - name: Test isolated Glyph companion tactics
        run: node --test backend/glyph-tactics.test.js
      - name: Check Automaton FSM
        run: node --test backend/automaton_fsm.test.js
